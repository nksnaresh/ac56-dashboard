<style>
:root{--bg:#f3f4f7;--card:#fff;--line:#d9dce5;--fg:#151722;--fg2:#4a4f63;--ink:#43308f;--err:#d03b3b}
@media (prefers-color-scheme: dark){:root{--bg:#0f1016;--card:#171922;--line:#2c3040;--fg:#eceef5;--fg2:#b2b7c9;--ink:#a99cf0;--err:#e66767;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px;width:100%;max-width:380px;display:grid;gap:14px}
.no{font:900 64px/0.9 "Arial Narrow",system-ui,sans-serif;color:var(--ink);letter-spacing:-.04em}
h1{margin:0;font-size:22px}
p{margin:0;color:var(--fg2);font-size:14px}
label{font:500 12px ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2)}
input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%}
button{font:600 15px system-ui,sans-serif;background:var(--ink);color:var(--card);border:0;border-radius:8px;padding:11px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#msg{min-height:20px;font-size:13px}
#msg.err{color:var(--err)}
.foot{font-size:12px}
</style>

<script>
(function(){
  const P = JSON.parse(document.getElementById('payload').textContent);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const msg = document.getElementById('msg'), go = document.getElementById('go');
  if (!window.crypto || !crypto.subtle || !window.DecompressionStream) { msg.className='err'; msg.textContent = 'This browser is too old to open the page. Use a recent Chrome, Safari, Edge or Firefox.'; go.disabled = true; return; }
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault(); go.disabled = true; msg.className=''; msg.textContent = 'Unlocking…';
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.s), iterations:P.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
      const gz = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.i)}, key, b64(P.c));
      const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
      document.open(); document.write(html); document.close();
    } catch (err) {
      go.disabled = false; msg.className = 'err'; msg.textContent = 'That password did not work. Check it and try again.';
      document.getElementById('pw').select();
    }
  });
})();
</script>
